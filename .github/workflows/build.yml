name: Build J2ME JAR
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Download J2ME Libraries
        run: |
          mkdir -p lib
          curl -L -o lib/midpapi20.jar https://maven.org
          curl -L -o lib/cldcapi11.jar https://maven.org
      - name: Fix line endings
        run: |
          sed -i 's/\r$//' src/main/java/tinyllm/TinyLLMMidlet.java || true
      - name: Compile Code
        run: |
          mkdir -p build/classes
          javac -source 1.3 -target 1.3 -bootclasspath lib/midpapi20.jar:lib/cldcapi11.jar -d build/classes src/main/java/tinyllm/TinyLLMMidlet.java
      - name: Create Manifest
        run: |
          mkdir -p build/META-INF
          cat << 'EOF' > build/META-INF/MANIFEST.MF
          MIDlet-Name: TinyLLM
          MIDlet-Version: 1.0
          MIDlet-Vendor: mgruszkiewicz
          MIDlet-1: TinyLLM,,tinyllm.TinyLLMMidlet
          MicroEdition-Configuration: CLDC-1.1
          MicroEdition-Profiles: MIDP-2.0
          EOF
      - name: Pack JAR Archive
        run: |
          mkdir -p dist
          cd build
          jar cfm ../dist/TinyLLM.jar META-INF/MANIFEST.MF tinyllm/TinyLLMMidlet.class
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: j2me-ready-jar
          path: dist/TinyLLM.jar
